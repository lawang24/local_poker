[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  # Build every main update, including changes outside frontend/.
  # Skip preview branches: main is the only deployment source.
  ignore = 'if [ "$BRANCH" = "main" ]; then exit 1; else exit 0; fi'

[build.environment]
  NODE_VERSION = "22"
  VITE_WS_URL = "wss://headwins-poker.onrender.com/ws"
